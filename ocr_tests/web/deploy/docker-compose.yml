# The Reading Desk on a server of your own: the app, and Caddy in front of it for HTTPS (a certificate is fetched and renewed by itself once the domain points here).
#   cp .env.example .env     (then fill it in)       docker compose up -d --build
services:
  app:
    build:
      context: ../../..
      dockerfile: ocr_tests/web/deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - rd_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1500m
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  rd_data:
  caddy_data:
  caddy_config:
